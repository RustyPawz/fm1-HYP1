# SPDX-License-Identifier: GPL-3.0-only
# HYP-1 on fm1-base, on its branch: builds and tests it, publishes nothing. Until the move is on main, this is how
# the branch is compiled (the JieLi toolchain is Linux x86-64).
#   1. the scenarios on HYP-1's old simulator (main's tree, in old/) and on fm1-base's, and what differs;
#   2. the engine's own test;
#   3. the firmware package, kept as the run's artifact (install it with base/tools/fm1_install.py).
name: fm1-base move (no publish)
on:
  push:
    branches: [fm1-base-move]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          ref: main
          path: old
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
      - name: The old simulator's scenarios (the baseline)
        run: |
          cd old
          sh host/build_host.sh
          mkdir -p ../cmp/old
          for s in tests/scenarios/*.amb; do
            n=$(basename "$s" .amb); mkdir -p "../cmp/old/$n"
            build/host/amb_host "$s" "../cmp/old/$n" > "../cmp/old/$n/stdout.txt" 2>&1 || echo "old: $n exit $?"
          done
      - name: fm1-base's simulator, the same scenarios
        run: |
          set -o pipefail
          ./build.sh --host 2>&1 | tee host-build.log
          mkdir -p cmp/new
          FAIL=0
          for s in tests/scenarios/*.amb; do
            n=$(basename "$s" .amb); mkdir -p "cmp/new/$n"
            if app/build/host/hyp_host "$s" "cmp/new/$n" > "cmp/new/$n/stdout.txt" 2>&1; then echo "  ok   $n"; else
              echo "  FAIL $n"; grep -n "FAIL\|unknown" "cmp/new/$n/stdout.txt" | head -12 | sed 's/^/       /'; FAIL=1; fi
          done
          exit $FAIL
      - name: What the two simulators wrote, compared
        if: always()
        run: |
          cd cmp
          for d in old/*/; do
            n=$(basename "$d")
            for f in "$d"*; do
              b=$(basename "$f")
              if [ ! -f "new/$n/$b" ]; then echo "$n/$b: missing on fm1-base"; continue; fi
              cmp -s "$f" "new/$n/$b" && echo "$n/$b: same" || echo "$n/$b: DIFFERS"
            done
          done | sort | tee compare.txt | grep -v ": same" || true
          echo "same: $(grep -c ': same' compare.txt), differ: $(grep -c DIFFERS compare.txt), missing: $(grep -c missing compare.txt)"
          for n in first sounds; do
            echo "--- $n stdout diff (first 40 lines)"; diff "old/$n/stdout.txt" "new/$n/stdout.txt" | head -40 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-compare
          path: cmp
      - name: The engine's test
        run: |
          cc -O2 -ffp-contract=off -std=c99 -Wall -Wextra -Wdouble-promotion -Werror -DEN_HOST -Iapp/dsp -Ibase/include \
            -o amb_test tests/host/amb_test.c app/dsp/amb.c -lm && ./amb_test | tail -3
      - name: JieLi toolchain and SDK (cached)
        id: jl
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Fetch them if not cached
        if: steps.jl.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || try base/tools/get_toolchain.sh
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: The firmware, a test build (not a release)
        run: |
          set -o pipefail
          ./build.sh --release "1.6.0-test$GITHUB_RUN_NUMBER" 2>&1 | tee build.log
          ls -l app/build/*.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: hyp1-on-fm1-base-test${{ github.run_number }}
          path: app/build/*.fwsc
